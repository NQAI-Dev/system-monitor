[project]
name = "system-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NQAI-Dev", email = "nqao-dev@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psutil>=7.2.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
system-monitor = "system_monitor:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-psutil>=7.2.2.20260906",
]
